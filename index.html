<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Interactive visualisations of classic algorithms, built with p5.js."
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" type="text/css" href="styles.css" />
    <script src="script.js" defer></script>
    <title>Algorithms Visualizer</title>
  </head>
  <body>
    <a class="skip-link" href="#stage">Skip to visualisation</a>

    <div class="app">
      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="#/">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-text">
            <strong>Algorithms</strong>
            <small>Visualizer &middot; p5.js</small>
          </span>
        </a>

        <nav class="nav" id="nav" aria-label="Algorithms"></nav>

        <div class="sidebar-footer">
          <p class="kbd-hints">
            <span><kbd>1</kbd>&ndash;<kbd>7</kbd> switch</span>
            <span><kbd>R</kbd> reload</span>
            <span><kbd>F</kbd> fullscreen</span>
          </p>
          <a
            class="repo-link"
            href="https://github.com/shreyventure"
            target="_blank"
            rel="noopener"
            >Built by @shreyventure</a
          >
        </div>
      </aside>

      <!-- Scrim for mobile off-canvas sidebar -->
      <div class="scrim" id="scrim" hidden></div>

      <!-- Main -->
      <main class="main">
        <header class="topbar">
          <button
            class="icon-btn menu-btn"
            id="menuBtn"
            aria-label="Toggle navigation"
            aria-expanded="false"
            aria-controls="sidebar"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h16M4 12h16M4 17h16" />
            </svg>
          </button>

          <div class="topbar-title">
            <h1 id="algoTitle">Welcome</h1>
            <div class="tags" id="algoTags"></div>
          </div>

          <div class="topbar-actions" id="topbarActions" hidden>
            <button class="icon-btn" id="reloadBtn" title="Reload sketch (R)">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 11a8 8 0 1 0-2.3 5.7" />
                <path d="M20 4v7h-7" />
              </svg>
              <span>Reload</span>
            </button>
            <button
              class="icon-btn"
              id="fullscreenBtn"
              title="Fullscreen (F)"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5" />
              </svg>
              <span>Fullscreen</span>
            </button>
            <a
              class="icon-btn"
              id="popoutBtn"
              href="#"
              target="_blank"
              rel="noopener"
              title="Open sketch in a new tab"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M14 4h6v6M20 4l-9 9" />
                <path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" />
              </svg>
              <span>Open</span>
            </a>
          </div>
        </header>

        <section class="stage" id="stage" tabindex="-1"></section>

        <footer class="infobar" id="infobar" hidden>
          <p class="blurb" id="algoBlurb"></p>
          <ul class="controls" id="algoControls"></ul>
        </footer>
      </main>
    </div>
  </body>
</html>
